<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="How mcp-usage works: local Claude Code transcripts are streamed through a parser into per-server stats, shown as a CLI report or MCP tools. Conversation content is never read out.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="1000" height="250" rx="14" fill="#0d1117"/>
<text x="500" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#f0f6fc">Everything stays on your machine</text>
<rect x="36" y="78" width="205" height="118" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
<text x="138.5" y="114" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#f0f6fc">Claude Code transcripts</text>
<text x="138.5" y="144" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#c9d1d9">~/.claude/projects/**/*.jsonl</text>
<text x="138.5" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#c9d1d9">local files, read-only</text>
<line x1="246" y1="137" x2="272" y2="137" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="277" y="78" width="205" height="118" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="379.5" y="114" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#f0f6fc">Streaming parser</text>
<text x="379.5" y="144" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#c9d1d9">tool_use names · result sizes</text>
<text x="379.5" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#c9d1d9">tool availability · failures</text>
<line x1="487" y1="137" x2="513" y2="137" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="518" y="78" width="205" height="118" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
<text x="620.5" y="114" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#f0f6fc">Per-server stats</text>
<text x="620.5" y="144" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#c9d1d9">used · unused</text>
<text x="620.5" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#c9d1d9">failed · needs-auth</text>
<line x1="728" y1="137" x2="754" y2="137" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="759" y="78" width="205" height="118" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
<text x="861.5" y="114" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#f0f6fc">CLI report + MCP tools</text>
<text x="861.5" y="144" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#c9d1d9">what to disconnect, fix</text>
<text x="861.5" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#c9d1d9">or authorize</text>
<text x="500" y="232" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">No network · no API key · prompts, responses, tool inputs and outputs are never returned</text>
</svg>
