name: Bug report
description: The report is wrong, a command fails, or the MCP server misbehaves.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Please never paste transcript content** (prompts, responses, tool outputs) or anything from `~/.claude/projects`.
        Server names can reveal which services you use; replace them with placeholders if you prefer.
        Could the tool leak transcript content? Report it privately instead: see [SECURITY.md](https://github.com/Rixtayz/mcp-usage/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you saw, and what you expected instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - CLI report (text)
        - CLI report (--json)
        - MCP server (mcp-usage serve)
        - Installation / npx
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`. Most bugs come from a change in Claude Code's transcript format, so this matters most.
      placeholder: "2.1.274"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mcp-usage version
      description: Output of `npx -y @rixtay/mcp-usage --version`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Node.js version
      placeholder: "Windows 11, Node 24.1.0"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: The summary lines or the affected rows, redacted as you see fit. The footer line ("Scanned N files… skipped N malformed lines") is especially useful.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no transcript content.
          required: true
